spring.application.name=gym-manager-test

# Testy używają bazy H2 w pamięci (w trybie zgodności z MySQL), więc nie wymagają uruchomionego MySQL
spring.datasource.url=jdbc:h2:mem:gymtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=testowy-sekret-jwt-dla-testow-integracyjnych-123456
app.jwt.expiration-minutes=60
app.seed-demo-data=false

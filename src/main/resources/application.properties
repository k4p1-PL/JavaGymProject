spring.application.name=gym-manager
server.port=8080

# --- Baza danych MySQL (lokalna) ---
# Hasło najlepiej podać w zmiennej środowiskowej DB_PASSWORD (albo wpisać poniżej zamiast pustej wartości)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = Hibernate sam tworzy/aktualizuje tabele na podstawie encji
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- JWT ---
# Sekret musi mieć co najmniej 32 znaki (HS256). W produkcji podaj go przez zmienną środowiskową JWT_SECRET.
app.jwt.secret=${JWT_SECRET:zmien-mnie-na-dlugi-losowy-sekret-min-32-znaki-gym-manager}
app.jwt.expiration-minutes=480

# --- Dane demonstracyjne (konta admin/trener/klubowicz, karnety, zajęcia) ---
app.seed-demo-data=true

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
